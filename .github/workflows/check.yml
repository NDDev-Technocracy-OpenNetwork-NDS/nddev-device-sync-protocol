name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned Rust compiler
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare the exact native quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@0c513d80a5ddb9ea6b3b6da0068547c2003e637c
        with:
          manifest: .github/native-tools.json
          directory: ${{ runner.temp }}/protocol-native-tools
          add-to-path: true
      - name: Install the verified Dart SDK
        shell: bash
        run: |
          dart_archive="$RUNNER_TEMP/dart-sdk.zip"
          curl --fail --show-error --location --retry 2 --max-time 300 \
            https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.7/sdk/dartsdk-linux-x64-release.zip \
            --output "$dart_archive"
          echo "eb99aed266efbcb615c6ae21c12f52cfe935b9f208bccc5fea7f64c21e867229  $dart_archive" | sha256sum --check -
          unzip -q "$dart_archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@f535b95d053fb1b225fce9a21d055599c6446a22
        with:
          recipe: setup
      - name: Check canonical source without compilation
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@f535b95d053fb1b225fce9a21d055599c6446a22
        with:
          recipe: check
      - name: Qualify rejection, signature and real Rust/Dart consumers
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@f535b95d053fb1b225fce9a21d055599c6446a22
        with:
          recipe: test
