name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
    with:
      hosted-runner: ubuntu-26.04
      timeout-minutes: 20
      setup: true
      python-version: "3.14.10"
      bun-version: "1.4.4"
      node-version: "26.13.1"
      rust-version: "1.100.0"
      rust-components: "clippy,rustfmt"
      dart-version: "3.13.5"
      tools: cargo-nextest@0.9.151
      tool-assets: .github/ci-tools.json
