name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-validation
  cancel-in-progress: false

jobs:
  quality:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/qualify@534b2785b49d5d36d074902aa9eefcb5786d898a # v0.6.83
        with:
          check-workflow: check.yml
          wait-minutes: "0"

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
