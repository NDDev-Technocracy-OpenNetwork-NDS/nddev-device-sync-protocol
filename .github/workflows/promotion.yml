name: promotion

on:
  # The action selects a checked dev SHA without running the triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [NDS checks]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@d9fbe93b75c105a99632ebbd9d70901404303acd # v0.6.80
    with:
      check-workflow: check.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
