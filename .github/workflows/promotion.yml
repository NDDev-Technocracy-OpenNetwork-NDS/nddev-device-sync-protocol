name: promotion

on:
  # The action selects a checked dev SHA without running the triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [NDS checks]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@9f400b71c978c8c3974863f4dd25331d3d1be79d # v0.6.176
    with:
      check-workflow: check.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
