name: promotion

on:
  # The action selects a checked dev SHA without running the triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [NDS checks]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
    with:
      check-workflow: check.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
