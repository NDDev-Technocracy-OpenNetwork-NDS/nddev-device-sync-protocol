name: promotion

on:
  # The action selects a checked dev SHA without running the triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [NDS checks]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@5af6f6d2d7039ff332b02aec2482107ac4381cdf # v0.6.170
    with:
      check-workflow: check.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
