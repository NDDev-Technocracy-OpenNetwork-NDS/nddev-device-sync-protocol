name: promotion

on:
  # The action selects a checked dev SHA without running the triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [NDS checks]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@c92818085dff62e5e3aded10dc90efc13d85d3de # v0.6.167
    with:
      check-workflow: check.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
