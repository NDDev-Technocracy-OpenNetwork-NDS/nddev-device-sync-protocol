openapi: 3.1.0
info:
  title: NDS personal-space observation
  version: 3.0.0-alpha.1
  license:
    name: AGPL-3.0-only
  description: Explicit personal context; original v2 authentication, device
    inventory constraints and no-store behavior remain. The device policy endpoint
    is the only mutation in this profile. No organizational authority
    is inferred from personal IDs. Each endpoint/profile owns its protocol version;
    this is not sync-v3 payload compatibility.
servers:
- url: https://self-hosted.example.invalid
paths:
  /v3/personal/devices:
    get:
      operationId: listPersonalDevices
      description: Derive the personal space from the current authenticated principal.
        Request fields cannot select another principal or organization. Return a bounded
        page under the original immutable storage binding. A context is an observation,
        not permission.
      responses:
        '200':
          description: Device page bound to the original authenticated personal context
          content:
            application/json:
              schema:
                $ref: ../contracts/v3/personal.schema.json#/$defs/PersonalDeviceList
        '400':
          $ref: control-plane-v2.yaml#/components/responses/InvalidRequest
        '401':
          $ref: control-plane-v2.yaml#/components/responses/AuthenticationFailed
        '429':
          $ref: control-plane-v2.yaml#/components/responses/RateLimited
        '503':
          $ref: control-plane-v2.yaml#/components/responses/ServiceUnavailable
      parameters:
      - $ref: control-plane-v2.yaml#/paths/~1v2~1devices/get/parameters/0
      - $ref: control-plane-v2.yaml#/paths/~1v2~1devices/get/parameters/1
      - $ref: control-plane-v2.yaml#/paths/~1v2~1devices/get/parameters/2
      security:
      - ownerSession: []
      - browserSession: []
  /v3/personal/devices/{device_id}/policy:
    parameters:
    - name: device_id
      in: path
      required: true
      schema:
        $ref: ../contracts/v2/control-plane.schema.json#/$defs/Identifier
    get:
      operationId: getPersonalDevicePolicy
      description: Return the current purpose profiles and fullauto/manual control
        mode of one device owned by the authenticated principal. Unknown or foreign
        devices are refused without disclosing whether they exist. A policy is
        authenticated control state, not a per-command flag.
      responses:
        '200':
          description: Device policy under the original authenticated personal context
          content:
            application/json:
              schema:
                $ref: ../contracts/v3/personal.schema.json#/$defs/PersonalDevicePolicy
        '400':
          $ref: control-plane-v2.yaml#/components/responses/InvalidRequest
        '401':
          $ref: control-plane-v2.yaml#/components/responses/AuthenticationFailed
        '429':
          $ref: control-plane-v2.yaml#/components/responses/RateLimited
        '503':
          $ref: control-plane-v2.yaml#/components/responses/ServiceUnavailable
      security:
      - ownerSession: []
      - browserSession: []
    put:
      operationId: replacePersonalDevicePolicy
      description: Compare-and-set replacement by the device's own active owner.
        Widening manual into fullauto requires a recent sign-in; narrowing and
        reclassification need only an active session. Revoked devices are refused.
        Device ID, key and proof never change; the revision advances by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v3/personal.schema.json#/$defs/DevicePolicyUpdate
      responses:
        '200':
          description: Replacement committed; the returned revision is current
          content:
            application/json:
              schema:
                $ref: ../contracts/v3/personal.schema.json#/$defs/PersonalDevicePolicy
        '400':
          $ref: control-plane-v2.yaml#/components/responses/InvalidRequest
        '401':
          $ref: control-plane-v2.yaml#/components/responses/AuthenticationFailed
        '403':
          $ref: control-plane-v2.yaml#/components/responses/RecentAuthenticationRequired
        '409':
          description: The expected revision is no longer current (operation_conflict);
            read the policy again before deciding.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '429':
          $ref: control-plane-v2.yaml#/components/responses/RateLimited
        '503':
          $ref: control-plane-v2.yaml#/components/responses/ServiceUnavailable
      security:
      - ownerSession: []
      - browserSession: []
      parameters:
      - $ref: control-plane-v2.yaml#/components/parameters/BrowserClient
components:
  securitySchemes:
    ownerSession:
      $ref: control-plane-v2.yaml#/components/securitySchemes/ownerSession
    browserSession:
      $ref: control-plane-v2.yaml#/components/securitySchemes/browserSession
